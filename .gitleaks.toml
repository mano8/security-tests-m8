title = "security-tests-m8 gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist"
paths = [
  # Test fixtures may contain deterministic low-entropy test values.
  '''tests/''',
  # Vendored copy of auth-sdk-m8's checksummed authorization fixture matrix
  # (§5.5, FIXTURE-01): signed with the SDK's documented trusted test signing
  # key (DoNotUseInProd) and a synthetic API-key literal, both inline in the
  # fixture itself. Byte-identical to auth-sdk-m8/auth_sdk_m8/testing/, which
  # carries the same path allowlist — values must not be rotated here.
  '''security_tests_m8/testing/''',
]
# Add SHAs of any prior accidental secret commits here after rotation:
# commits = [
#   "abc123def456",  # description of what was rotated and when
# ]
